name: clean-bypass-list.yml

on:
  schedule:
    - cron: '0 2 * * *'   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download original list
        run: |
          curl -fsSL -o source.txt \
            https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-vpn-proxy-bypass.txt

      - name: Clean and filter list
        run: |
          grep -v '^#' source.txt \
            | grep -v '^$' \
            | grep -viE '(^|[.*])tailscale\.com$' \
            | sort -u > bypass-cleaned.txt

          # Guard against truncated/empty downloads
          if [ "$(wc -l < bypass-cleaned.txt)" -lt 100 ]; then
            echo "Cleaned list suspiciously small, aborting" >&2
            exit 1
          fi

      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bypass-cleaned.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update cleaned list"
            git push
          fi
